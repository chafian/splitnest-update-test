# Builds, checks and publishes a SplitNest release from a version tag (vX.Y.Z, or vX.Y.Z-beta.N for a
# prerelease). Push the tag only after bumping package.json to that version.
#
#   test     the full CI suite (ci.yml)
#   build    npm run make on a GitHub-hosted Windows runner; release files under fixed names;
#            SHA256SUMS.txt and BINARIES.md (fails on wrong file metadata); feed consistency;
#            installer smoke test (install, no update request before the first-run notice,
#            self-test, uninstall); build provenance attestation; uploaded as a workflow artifact
#   sign     OFF unless the repository variable SIGNPATH_ENABLED is 'true' (only after the SignPath
#            Foundation has approved the project and the secrets exist; see CODE_SIGNING.md). While
#            the signing steps are not configured it fails on purpose, so a release that is meant
#            to be signed is never published unsigned.
#   publish  only for a pushed tag: creates a DRAFT release with every file, downloads them back
#            and verifies them, then publishes it (and rebuilds the website). Any failure leaves the
#            release a draft (or absent); nothing partial is ever visible as "latest".
#
# Manual run (Actions > Release > Run workflow): test + build only, nothing is published.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build and check (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      # Installed builds update from this repository's releases (vite.main.config.ts).
      TW_UPDATE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm
      - run: npm ci
      - name: Version matches the tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            node scripts/release/check-version.mjs "${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            v=$(node -p "require('./package.json').version")
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build installer and portable ZIP
        run: npm run make
      - name: Collect release files, checksums and binary inventory
        run: node scripts/release/collect-assets.mjs out release/assets
      - name: Verify release files and update feed
        run: node scripts/release/verify-assets.mjs release/assets ${{ steps.version.outputs.version }}
      - name: Installer smoke test (install, privacy, self-test, uninstall)
        run: node scripts/release/installer-smoke.mjs release/assets/SplitNest-win32-x64-Setup.exe ${{ steps.version.outputs.version }} release/installer-check.json
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/assets/SplitNest-win32-x64-Setup.exe
            release/assets/SplitNest-win32-x64-portable.zip
            release/assets/splitnest-*-full.nupkg
      - name: Upload release files (unsigned)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            release/assets
            release/release-notes.md
            release/installer-check.json
          if-no-files-found: warn
          retention-days: 30

  sign:
    name: Code signing (SignPath, disabled)
    needs: build
    if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    steps:
      # Signing is not configured yet. When the SignPath Foundation has approved the project:
      #  1. sign the application files (splitnest.exe, the Squirrel launcher) BEFORE the installer is
      #     made, with signpath/github-action-submit-signing-request@v1 on an artifact uploaded by
      #     actions/upload-artifact (all preceding jobs on GitHub-hosted runners; manual approval);
      #  2. make the installer and update package from the signed files and sign Setup.exe;
      #  3. regenerate SHA256SUMS.txt and BINARIES.md, check every "ours" file is signed by
      #     SignPath Foundation and every upstream file is unchanged, and upload the result as the
      #     release-files artifact for the publish job.
      # Until then this job fails, so turning the variable on can never publish unsigned files.
      - name: Refuse to publish unsigned files when signing is expected
        shell: bash
        run: |
          echo "::error::SIGNPATH_ENABLED is 'true' but the signing steps are not configured. Nothing will be published."
          exit 1

  publish:
    name: Publish (draft, verify, then release)
    needs: [build, sign]
    # Every gate explicit: always() is only there so a skipped sign job doesn't skip publishing.
    if: ${{ always() && github.event_name == 'push' && github.ref_type == 'tag' && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release
      - name: Verify the files once more
        run: node scripts/release/verify-assets.mjs release/assets ${{ env.VERSION }}
      - name: Create the release as a draft with every file
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft -q .isDraft > state.txt 2>/dev/null; then
            if [ "$(cat state.txt)" = "true" ]; then
              echo "Removing the unfinished draft for $TAG from an earlier run."
              gh release delete "$TAG" --yes
            else
              echo "::error::Release $TAG is already published; not touching it."
              exit 1
            fi
          fi
          flags=(--draft --verify-tag --title "SplitNest $VERSION" --notes-file release/release-notes.md)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "${flags[@]}" release/assets/*
      - name: Download the draft's files and verify them
        shell: bash
        run: |
          set -euo pipefail
          mkdir check
          gh release download "$TAG" --dir check
          node scripts/release/verify-assets.mjs check "$VERSION"
          for f in release/assets/*; do cmp "$f" "check/$(basename "$f")"; done
      - name: Publish the release
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then gh release edit "$TAG" --draft=false; else gh release edit "$TAG" --draft=false --latest; fi
          gh release view "$TAG" --json isDraft,isPrerelease,url
      - name: Rebuild the website (download links and changelog)
        shell: bash
        run: |
          if [ -f .github/workflows/pages.yml ]; then gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}" || echo "::warning::Could not start the website build."; fi

  diagnostics:
    name: (test repository only) publish installer check results
    needs: build
    if: ${{ always() && github.repository != 'chafian/splitnest' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release
        continue-on-error: true
      - name: Publish
        shell: bash
        run: |
          gh release view build-diagnostics >/dev/null 2>&1 || gh release create build-diagnostics --prerelease --title "build diagnostics" --notes "test repository only"
          if [ -f release/installer-check.json ]; then gh release upload build-diagnostics release/installer-check.json --clobber; else echo "no results"; fi
